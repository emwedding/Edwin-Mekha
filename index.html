<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mekha & Edwin | Wedding Invitation</title>
    <style>
        body { margin: 0; background: #020810; font-family: sans-serif; overflow: hidden; }
        
        /* Fixed overlay container covers the viewport */
        .stage { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 1000; }
        
        /* The Card: Always in the center, always fixed */
        .card-sheet {
            position: fixed;
            width: 85%; max-width: 400px;
            aspect-ratio: 1.4;
            background: #F7E7CE;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 20;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .card-sheet.zoom-in {
            width: 100vw; height: 100vh;
            max-width: none; border-radius: 0;
        }

        /* The Envelope Container moves independently */
        .envelope-wrap {
            position: relative; width: 85%; max-width: 400px; aspect-ratio: 1.4;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 30;
        }
        .envelope-wrap.slide-out { transform: translateY(120%); }
    </style>
</head>
<body>

<div class="stage">
    <!-- Card sits underneath -->
    <div class="card-sheet" id="card">
        <p>As our next chapter begins...</p>
    </div>
    <!-- Envelope wraps around -->
    <div class="envelope-wrap" id="envelope">
        <div style="width:100%; height:100%; background:#05111D;" onclick="start()">[Click to Open]</div>
    </div>
</div>

<script>
    function start() {
        document.getElementById('envelope').classList.add('slide-out');
        document.getElementById('card').classList.add('zoom-in');
        
        setTimeout(() => {
            // Fade out the entire stage after 2.5s hold
            document.querySelector('.stage').style.opacity = '0';
            setTimeout(() => document.querySelector('.stage').style.display = 'none', 500);
        }, 2500);
    }
</script>
</body>
</html>
